<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life OS - Focus Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
</head>
<body>
<div class="container py-4">
  <h1>Life OS Focus Hub</h1>
  <p>Use this static UI with the FastAPI backend at <code>http://127.0.0.1:8000</code>.</p>
  <textarea id="brainDump" class="form-control mb-2" rows="3" placeholder="I should learn Unreal, fix finances, clean"></textarea>
  <button class="btn btn-primary" onclick="submitIntake()">Process</button>
  <pre id="out" class="mt-3"></pre>
</div>
<script>
const API_URL = "http://127.0.0.1:8000";
async function submitIntake(){
  const text = document.getElementById('brainDump').value;
  const res = await fetch(`${API_URL}/api/intake`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
  const data = await res.json();
  document.getElementById('out').textContent = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
